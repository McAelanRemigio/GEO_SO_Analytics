[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "study-abroad-analytics"
version = "1.0.0"
description = "A Python package for processing, validating, and analyzing Study Abroad reports."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0"
]

[project.optional-dependencies]
excel = [
    "openpyxl>=3.1",
    "xlrd>=2.0"
]
dev = [
    "pytest>=7.0"
]

[tool.setuptools.packages.find]
include = ["study_abroad_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
